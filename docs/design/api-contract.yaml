openapi: 3.0.3
info:
  title: GlamHub API
  version: 1.0.0
  description: REST API for GlamHub subscription CRM and marketplace

servers:
  - url: https://api.staging.glamhub.example.com
    description: Staging
  - url: https://api.glamhub.example.com
    description: Production

tags:
  - name: auth
    description: Authentication and authorization
  - name: professionals
    description: Professional profile management
  - name: clients
    description: Client management
  - name: portfolios
    description: Public portfolios and services
  - name: leads
    description: Lead pipeline
  - name: bookings
    description: Calendar and bookings
  - name: quotes
    description: Quotes and invoices
  - name: reviews
    description: Reviews and replies
  - name: admin
    description: Super admin panel
  - name: billing
    description: Plans, subscriptions, payments
  - name: notifications
    description: Email and WhatsApp notifications

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
                role: {type: string, enum: [professional, client]}
      responses:
        '201': {description: User created}
        '400': {description: Validation error}
        '409': {description: Email already exists}

  /auth/login:
    post:
      tags: [auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200': {description: Session token returned}
        '401': {description: Invalid credentials}

  /auth/login/otp:
    post:
      tags: [auth]
      summary: Send phone OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {type: string}
      responses:
        '200': {description: OTP sent}

  /auth/login/google:
    post:
      tags: [auth]
      summary: Google OAuth login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken: {type: string}
      responses:
        '200': {description: Session token returned}

  /professionals/me:
    get:
      tags: [professionals]
      summary: Get own professional profile
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Professional profile}
        '401': {description: Unauthorized}
        '404': {description: Not found}

  /professionals/me:
    put:
      tags: [professionals]
      summary: Update own professional profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName: {type: string}
                category: {type: string}
                city: {type: string}
                bio: {type: string}
      responses:
        '200': {description: Updated profile}
        '401': {description: Unauthorized}
        '400': {description: Validation error}

  /portfolios:
    get:
      tags: [portfolios]
      summary: List public portfolios
      parameters:
        - name: category
          in: query
          schema: {type: string}
        - name: city
          in: query
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
      responses:
        '200': {description: List of portfolios}

  /portfolios/{id}:
    get:
      tags: [portfolios]
      summary: Get public portfolio detail
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Portfolio detail}
        '404': {description: Not found}

  /clients:
    get:
      tags: [clients]
      summary: List own clients
      security: [{bearerAuth: []}]
      responses:
        '200': {description: List of clients}

  /leads:
    get:
      tags: [leads]
      summary: List own leads
      security: [{bearerAuth: []}]
      responses:
        '200': {description: List of leads}

  /leads:
    post:
      tags: [leads]
      summary: Create a lead
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Lead created}

  /bookings:
    get:
      tags: [bookings]
      summary: List own bookings
      security: [{bearerAuth: []}]
      responses:
        '200': {description: List of bookings}

  /bookings:
    post:
      tags: [bookings]
      summary: Create a booking
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Booking created}
        '409': {description: Slot unavailable}

  /quotes:
    get:
      tags: [quotes]
      summary: List own quotes
      security: [{bearerAuth: []}]
      responses:
        '200': {description: List of quotes}

  /quotes:
    post:
      tags: [quotes]
      summary: Create a quote
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Quote created}

  /invoices:
    get:
      tags: [quotes]
      summary: List own invoices
      security: [{bearerAuth: []}]
      responses:
        '200': {description: List of invoices}

  /reviews:
    get:
      tags: [reviews]
      summary: List reviews for a professional
      security: [{bearerAuth: []}]
      responses:
        '200': {description: List of reviews}

  /reviews:
    post:
      tags: [reviews]
      summary: Create a review (after completed booking)
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Review created}
        '403': {description: Booking not completed}

  /admin/professionals:
    get:
      tags: [admin]
      summary: List all professionals
      security: [{bearerAuth: [super_admin, admin_staff]}]
      responses:
        '200': {description: List of professionals}
        '403': {description: Forbidden}

  /admin/professionals/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a professional
      security: [{bearerAuth: [super_admin]}]
      responses:
        '200': {description: Approved}
        '403': {description: Forbidden}

  /admin/professionals/{id}/suspend:
    post:
      tags: [admin]
      summary: Suspend a professional
      security: [{bearerAuth: [super_admin]}]
      responses:
        '200': {description: Suspended}
        '403': {description: Forbidden}

  /admin/plans:
    get:
      tags: [billing]
      summary: List subscription plans
      security: [{bearerAuth: [super_admin]}]
      responses:
        '200': {description: List of plans}

  /billing/webhooks/razorpay:
    post:
      tags: [billing]
      summary: Razorpay webhook
      responses:
        '200': {description: Webhook processed}
        '400': {description: Invalid signature}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      format: JWT